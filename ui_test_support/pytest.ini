[pytest]
testpaths = ..
python_files = test_*.py
python_functions = test_*
addopts = -ra --strict-markers --tb=short
markers =
    smoke: 所有菜单页面加载与关键正文断言
    navigation: 通过实际侧栏菜单进入页面
    tabs: 业务标签与嵌套规则展开
    forms: 新增/导入/调整表单打开与取消
    query: 查询、分页与详情
    calculation: 只读规则试算及数值断言
    export: 实际文件下载与 Excel 内容验证
    login: 隔离浏览器中的登录 UI 与自动登录
    consistency: 跨页面数据一致性检查
filterwarnings =
    ignore:.*pytest_jsonreport.*:DeprecationWarning
